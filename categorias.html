<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raíces Peruanas - Categorías</title>
    <link href="/css/categorias.css" rel="stylesheet">
</head>
<body>
    <div class="presentacion">
        <div class="marca">
            <h2 class="titulo_marca">🇵🇪 Raíces Peruanas</h2>
        </div>
        <div class="container">
            <h1 id="bienvenida" class="titulo">Elige tu categoría</h1>
            <p class="punto">Cada respuesta correcta te dará <span>4 puntos</span> </p>

            <div class="categorias">
                <a href="niveles.html?categoria=cultura" class="card cultura">
                    <h3>🎭 Cultura</h3>
                    <p>Arte, costumbres y tradiciones del Perú.</p>
                </a>

                <a href="niveles.html?categoria=historia" class="card historia">
                    <h3>📜 Historia</h3>
                    <p>Acontecimientos y personajes que marcaron al Perú.</p>
                </a>

                <a href="niveles.html?categoria=gastronomia" class="card geografia">
                    <h3>🌍 Geografía</h3>
                    <p>Regiones, paisajes y maravillas naturales.</p>
                </a>
            </div>
        </div>
    </div>
    <script>
        // Obtener el nombre del jugador desde el almacenamiento local
        const jugador = localStorage.getItem("jugador") || "Jugador";
        document.getElementById("bienvenida").textContent = `¡Bienvenid@, ${jugador}! Elige tu categoría`;
    </script>
</body>
</html>
